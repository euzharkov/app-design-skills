<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Store screenshots</title>
    <!-- Same <head> as the mockup's pages: fonts, icon library, and the same
         token file (tokens.css; design-system.css in older mockups). If this
         page lives in its own folder, point at the mockup's copy, e.g.
         ../mobile/tokens.css. -->
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="mockup-core.css" />
    <link rel="stylesheet" href="phone.css" />
    <!-- Desktop / Mac companion: uncomment when the mockup has window.css/js. -->
    <!-- <link rel="stylesheet" href="window.css" /> -->
    <link rel="stylesheet" href="store.css" />
    <style>
      /* ---- Screen CSS ----
         Copy the style rules the placed screens need from the mockup page
         that owns them (or link its shared screens.css), unchanged. Frame
         layout for this page only (a breakout card, a glow position, the
         feature graphic's art) goes below it, using token values. */
      .demo-card {
        background: var(--card);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-card);
        padding: var(--space-5);
        margin-top: var(--space-4);
      }
      .demo-art {
        position: absolute;
        right: 28px;
        top: 50%;
        transform: translateY(-50%);
        width: 150px;
        height: 150px;
        border-radius: var(--radius-card);
        background: var(--accent-decorative);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="mockup-core.js"></script>
    <script src="phone.js"></script>
    <!-- <script src="window.js"></script> -->
    <script src="store.js"></script>
    <script>
      /* ================= screens =================
         Place the mockup's existing screens: copy their template literals
         (and page-local helpers) here unchanged, or load a shared
         screens.js. Note each one's screen id. Write each phone screen as a
         function of platform so the Play cut gets Android chrome. */
      const demoScreen = (platform) =>
        phone(
          `<h1 class="t-title">Replace with a real screen</h1>
           <p class="t-body" style="margin-top: var(--space-2)">Paste the mockup screen for this frame.</p>
           <div class="demo-card"><div class="t-subheading">Placeholder card</div><div class="t-callout">Copied from the mockup, unchanged.</div></div>
           <div class="demo-card"><div class="t-subheading">Placeholder card</div><div class="t-callout">The frame crops below the copy band.</div></div>`,
          { platform },
        );

      /* ================= frames =================
         One entry per store frame, in upload order. id + position give the
         export name (01-hero.png). Headlines, captions and order are the
         person's; the placeholders below are only there to show the slots. */
      renderStorePage({
        title: "Store screenshots",
        intro:
          "Starter page. Replace the frames below with the person's shots, then export with export.sh. Toggle Dark in the toolbar to see the dark set; the contrast audit at the bottom covers both.",
        shots: [
          {
            id: "hero",
            hero: true,
            eyebrow: "Eyebrow",
            headline: "Headline as given",
            caption: "Optional caption.",
            device: demoScreen,
            scale: 0.92,
          },
          {
            id: "second",
            eyebrow: "Eyebrow",
            headline: "Second headline",
            device: demoScreen,
          },
          {
            id: "night",
            night: true,
            eyebrow: "Eyebrow",
            headline: "A frame forced dark",
            device: demoScreen,
            android: { caption: "Per-platform override for the Play cut." },
          },
        ],
        subs: [{ id: "plus-monthly", word: "Plus", tag: "Monthly" }],
        feature: {
          mark: "Product name",
          headline: "Headline as given",
          art: `<div class="demo-art"></div>`,
        },
        mac: [
          /* Mac App Store frames: device = win(…) from window.js (or any
             rendered desktop frame HTML). Leave empty for phone-only apps. */
        ],
      });
    </script>
  </body>
</html>
