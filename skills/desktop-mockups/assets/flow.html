<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow</title>
    <!-- Keep the head identical to index.html (fonts, icons, all stylesheets)

    <link rel="stylesheet" href="mockup-core.css" />
    <link rel="stylesheet" href="window.css" />
    <!-- Swap for the icon source chosen during discovery (see DESIGN-SYSTEM.md). -->

    <style>
      /* Layer 2: screen CSS for this page only. Compose freely, but take
         every color, size, radius, and space from design-system values. */
    </style>

  <body>
    <div id="app"></div>

    <script src="mockup-core.js"></script>
    <script src="window.js"></script>
    <script>

      renderMockupPage({
        title: "PRODUCT — WINDOW AREA",
        intro: "What this page covers and how it relates to the other pages. Link siblings: <a href='index.html'>index</a>.",

        defaultZoom: 70,
        sections: [
          {
            id: "first-window",
            title: "First window",
            desc: "What this surface is for. One section per window type; one column per state.",
            cols: [
              {
                label: "<b>State.</b> What this window shows and why.",
                html: win(`<h2 class="t-title">First window</h2>`, { title: "Window", size: [800, 520], minSize: [640, 420] }),
              },
            ],
            notes: [],
          },
        ],
        pageNotes: [],
      });
