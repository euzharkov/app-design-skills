<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Social card</title>
    <!--
      Source of social-card.jpg (2000×1000). Every surface on the right is the
      live Fieldnote example, not a drawing of it. To regenerate: run the store
      and icon exports (examples/fieldnote/store/export.sh,
      examples/fieldnote/icon export) so out/ exists, serve the repo root, then

        "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
          --window-size=2000,1000 --hide-scrollbars --virtual-time-budget=15000 \
          --screenshot=card.png http://localhost:4680/examples/social-card.html
        sips -s format jpeg -s formatOptions 88 card.png --out social-card.jpg
    -->
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 2000px;
        height: 1000px;
        overflow: hidden;
        font-family: -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        background:
          radial-gradient(900px 700px at 8% 10%, #c9dccd 0%, transparent 70%),
          radial-gradient(1000px 800px at 95% 100%, #e9d9c4 0%, transparent 70%),
          linear-gradient(135deg, #dfe8dd 0%, #efe7da 100%);
        position: relative;
      }
      .copy {
        position: absolute;
        left: 96px;
        top: 230px;
        width: 720px;
        color: #1d2420;
      }
      .copy h1 {
        font-size: 88px;
        line-height: 94px;
        font-weight: 700;
        letter-spacing: -2.5px;
      }
      .copy p {
        margin-top: 34px;
        font-size: 31px;
        line-height: 44px;
        color: #48524c;
      }
      .copy p b {
        color: #1d2420;
        font-weight: 600;
      }
      .cmd {
        margin-top: 46px;
        display: inline-block;
        background: rgba(255, 253, 249, 0.92);
        border-radius: 22px;
        padding: 24px 30px;
        font: 600 25px/1 ui-monospace, "SF Mono", Menlo, monospace;
        white-space: nowrap;
        color: #1d2420;
        box-shadow: 0 18px 40px -22px rgba(29, 36, 32, 0.45);
      }

      /* Each surface is a cropped iframe of the real example page, scaled. */
      .crop {
        position: absolute;
        overflow: hidden;
        transform-origin: 0 0;
      }
      .crop iframe {
        position: absolute;
        border: 0;
        width: 1600px;
        height: 1400px;
      }
      .mac {
        left: 1010px;
        top: 110px;
        width: 1080px;
        height: 700px;
        transform: scale(0.84);
        border-radius: 12px;
        box-shadow: 0 50px 90px -40px rgba(29, 36, 32, 0.55), 0 0 0 1px rgba(0, 0, 0, 0.08);
      }
      .mac iframe {
        left: -44px;
        top: -414px;
      }
      .phone {
        left: 900px;
        top: 350px;
        width: 390px;
        height: 844px;
        transform: scale(0.74);
        border-radius: 54px;
        box-shadow: 0 50px 80px -30px rgba(29, 36, 32, 0.6);
      }
      .phone iframe {
        left: -44px;
        top: -360px;
      }
      .shot {
        position: absolute;
        right: 56px;
        top: 440px;
        height: 520px;
        border-radius: 22px;
        box-shadow: 0 40px 70px -30px rgba(29, 36, 32, 0.55);
      }
      .icon {
        position: absolute;
        left: 1340px;
        top: 780px;
        width: 150px;
        height: 150px;
        border-radius: 34px;
        box-shadow: 0 26px 46px -20px rgba(29, 36, 32, 0.6);
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <h1>Design apps in plain&nbsp;HTML</h1>
      <p>
        <b>app-design-skills</b> — mobile, desktop, App Store screenshots and app icons, on one design system.
        For Claude Code, Codex, Cursor, and more.
      </p>
      <div class="cmd">npx skills add euzharkov/app-design-skills</div>
    </div>

    <div class="crop mac"><iframe src="fieldnote/desktop/?solo=journal&zoom=100" scrolling="no"></iframe></div>
    <img class="shot" src="fieldnote/store/out/apple/iphone-6.9/01-hero.png" alt="" />
    <div class="crop phone"><iframe src="fieldnote/mobile/?solo=daily-loop&zoom=100" scrolling="no"></iframe></div>
    <img class="icon" src="fieldnote/icon/out/ios/AppIcon-1024.png" alt="" />
  </body>
</html>
